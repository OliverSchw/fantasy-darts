<h1>Admin</h1>
<nav class="admin-tabs" aria-label="Admin">
  {% for href, icon, label in [("/admin", "📊", "Overview"), ("/admin/users", "👥", "Members"), ("/admin/schedule", "📅", "Schedule"), ("/admin/players", "🎯", "Players"), ("/admin/rules", "⚙️", "Rules")] %}
    <a href="{{ href }}" {% if path == href or (href != "/admin" and path.startswith(href)) %}aria-current="page"{% endif %}>
      <span class="ico">{{ icon }}</span><span>{{ label }}</span>
    </a>
  {% endfor %}
</nav>
