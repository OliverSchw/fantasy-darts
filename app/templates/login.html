{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<article class="narrow">
  <h1>Log in</h1>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username <input name="username" autocomplete="username" autocapitalize="none" value="{{ username or '' }}" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
  {% if invite_enabled %}
    <p class="muted">No account yet? <a href="/register">Register with your invite code</a>.</p>
  {% else %}
    <p class="muted">No account? Ask the admin of your league.</p>
  {% endif %}
</article>
{% endblock %}
