{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<article class="narrow">
  <h1>Join the league</h1>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <label>Invite code <input name="code" value="{{ code or '' }}" autocapitalize="none" autocomplete="off" required></label>
    <label>Username <input name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" maxlength="40" required></label>
    <label>Password <input name="password" type="password" autocomplete="new-password" minlength="6" required></label>
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="/login">Log in</a>.</p>
</article>
{% endblock %}
